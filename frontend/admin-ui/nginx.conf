server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access; the gateway owns routing to the individual services.
    # The address is resolved per request through Docker DNS so a recreated gateway is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway "gateway:8080";
        proxy_pass http://$gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
