name: pdr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pdr
      POSTGRES_PASSWORD: pdr
      POSTGRES_DB: pdr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdr"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Browser-facing issuer; back-channel calls from containers keep their own host.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/pdr-realm.json:/opt/keycloak/data/import/pdr-realm.json:ro

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pdr
      RABBITMQ_DEFAULT_PASS: pdr
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pdr
      MINIO_ROOT_PASSWORD: pdrpdrpdr
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  seq:
    image: datalust/seq:2025.1
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
