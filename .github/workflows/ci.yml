name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore backend/PaymentDataReadiness.slnx
      - name: Build
        run: dotnet build backend/PaymentDataReadiness.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test backend/PaymentDataReadiness.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-ui, admin-ui]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
